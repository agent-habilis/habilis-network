[toolchain]
# Single source of truth for the toolchain on every env (local + CI), for build, lint and
# format alike. A dated nightly, because rustfmt.toml (imports_granularity) and the rustc
# lint non_exhaustive_omitted_patterns need one. Moving the date is a named commit: rerun the
# clippy rows of ci.yml on both dates first. CI reads this file via
# actions-rust-lang/setup-rust-toolchain — do not duplicate the version in the workflows.
channel = "nightly-2026-06-05"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
