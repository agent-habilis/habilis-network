name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Reads rust-toolchain.toml — do not duplicate the version here.
      # The extra target is for `habilis-network-chunks`, whose IndexedDB backend
      # only exists on wasm32 and would otherwise compile nowhere.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `blob` is off by default (only agent-gossip enables it), so the line
      # above never lints `src/blob/` — ~1,300 lines including its own ALPN
      # server. `--all-features` below only *checks* it.
      - name: Clippy (blob)
        run: cargo clippy -p habilis-network --features blob --all-targets -- -D warnings

      # A doc link that does not resolve is the same drift as a stale comment,
      # and nothing else here would catch it: 25 had accumulated, including a
      # method renamed out from under its own docs.
      - name: Doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --all-features

      - name: Check
        run: cargo check --workspace --all-targets

      # The `mdns` and `dht` features exist so a consumer can drop iroh's
      # discovery closure, and `async-io` so `habilis-network-util` can shed tokio.
      # Nothing else proves those combinations still compile.
      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

      - name: Check (all features)
        run: cargo check --workspace --all-features

      # `habilis-network-iroh-webrtc-transport` compiles one of two mutually exclusive
      # backends and neither is on by default, so the steps above — which all
      # run with default features — build neither. `native` is the str0m one,
      # and it owns the loopback test.
      - name: Check (webrtc, native backend)
        run: cargo check -p habilis-network-iroh-webrtc-transport --features native,bench --all-targets

      - name: Clippy (webrtc, native backend)
        run: cargo clippy -p habilis-network-iroh-webrtc-transport --features native,bench --all-targets -- -D warnings

      # Six crates are reachable on wasm32 and nowhere else, and between them
      # that is a substantial amount of code no other job compiles:
      # `habilis-network-chunks`'s IndexedDB backend, the whole `web` backend of the
      # WebRTC transport, the portable half of the engine, `habilis-network-netplay`'s
      # simulation, `habilis-network-stream`'s byte streams, and `habilis-network-wasm`, the
      # browser peer, which has no other target at all. Without these steps
      # that code rots silently, and the `#[expect(...)]` attributes inside it
      # are never lint-checked either.
      #
      # Clippy, not just check. The `web` backend had never been linted before
      # this job existed and carried 18 findings on its first pass.
      #
      # Only these crates build for wasm32, hence `-p` throughout. No
      # rustflags and no C toolchain are needed: none of them pulls
      # `getrandom` or a C dependency.
      - name: Check (wasm32)
        run: |
          # `wasm-simd` only changes blake3's codegen (it assumes +simd128 at
          # runtime, not at compile time), so checking with it on costs nothing
          # and keeps the feature from rotting.
          cargo check --target wasm32-unknown-unknown -p habilis-network-chunks --all-targets --features wasm-simd
          cargo check --target wasm32-unknown-unknown -p habilis-network-iroh-webrtc-transport --features web,bench
          # The engine itself must reach the browser, not merely be avoidable
          # from it. `--no-default-features` is the portable half: no `host`,
          # so no IPC listener, no state file, no process helpers. Without this
          # gate the wasm target rots on the next edit that reaches for a file
          # or a socket.
          #
          # Not `--all-targets`: the unit tests pull proptest and insta, which
          # are host-only dev-deps. The one wasm test target is named below.
          cargo check --target wasm32-unknown-unknown -p habilis-network --no-default-features
          cargo check --target wasm32-unknown-unknown -p habilis-network --no-default-features --test wasm_runtime
          # habilis-network-netplay sits above the engine (rollback netcode for
          # peer-to-peer games, not part of it), but must be just as
          # portable: a browser peer is exactly who needs it, and a match
          # between a browser and a terminal only works if both run a
          # bit-identical simulation.
          cargo check --target wasm32-unknown-unknown -p habilis-network-netplay --no-default-features
          # habilis-network-stream runs unchanged in a tab: both the producer's accept
          # side and the consumer's dial.
          cargo check --target wasm32-unknown-unknown -p habilis-network-stream
          # The browser peer itself (packages/habilis-network-wasm's Rust half).
          cargo check --target wasm32-unknown-unknown -p habilis-network-wasm
          # The browser side of `cargo task benchmark`.
          cargo check --target wasm32-unknown-unknown -p habilis-network-bench-wasm

      # `-D clippy::disallowed_methods` is what forbids the Tokio calls that panic in a browser
      # (the list is in `clippy.toml`); the lint is off in the workspace, and a wasm32 row turns it
      # on for every crate it compiles.
      - name: Clippy (wasm32)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-chunks --all-targets --features wasm-simd -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-iroh-webrtc-transport --features web,bench -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-iroh-multihop-transport -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network --no-default-features -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-netplay --no-default-features -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-stream -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-wasm -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-bench-wasm -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-protocol --no-default-features -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-util --no-default-features -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-iroh-transport-util -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-iroh-gossip-transport -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-doc --no-default-features -- -D warnings -D clippy::disallowed_methods
          cargo clippy --target wasm32-unknown-unknown -p habilis-network-logging --no-default-features -- -D warnings -D clippy::disallowed_methods

      # A path in `clippy.toml` that names no function is a plain warning, which `-D warnings`
      # leaves alone: a typo would switch one entry off. Clippy prints it only when it lints the
      # crate, so the crate is cleaned first: the step above left it fresh. The step matches
      # clippy's warning text, so the probe is what keeps the match honest across toolchain
      # updates: clippy runs on a scratch config with a path that names no function, and a
      # reworded message fails there instead of passing the real check.
      - name: Clippy list names only functions
        run: |
          crate=habilis-network-iroh-gossip-transport
          dead='does not refer to a reachable function'
          probe=$(mktemp -d)
          echo 'disallowed-methods = [{ path = "tokio::time::sleeeep" }]' > "$probe/clippy.toml"
          cargo clean -p $crate --target wasm32-unknown-unknown
          out=$(CLIPPY_CONF_DIR="$probe" cargo clippy --target wasm32-unknown-unknown -p $crate 2>&1)
          if ! grep -q "$dead" <<< "$out"; then
            echo "clippy did not warn about a path that names no function: has its message changed?"
            exit 1
          fi
          cargo clean -p $crate --target wasm32-unknown-unknown
          out=$(cargo clippy --target wasm32-unknown-unknown -p $crate -- -D warnings -D clippy::disallowed_methods 2>&1)
          if grep "$dead" <<< "$out"; then
            echo "clippy.toml lists a path that names no function"
            exit 1
          fi

      # Runs habilis-network-stream's integration tests too, relay and WebRTC-only ones
      # included, on purpose: they are the only CI proof of the stream's
      # direct-path gate. habilis-network-stream's dev-dependency turns on
      # `iroh-test-utils`, so habilis-network's relay-policy proofs run here as well.
      # It also runs the binaries-only end to end
      # (habilis-network-stream-cli/tests/binary.rs); the browser one is e2e.yml.
      - name: Test
        run: cargo test --workspace

      # Not covered by `--workspace` above: `blob` is off by default, so its
      # ticket round-trips and the loopback offload→fetch test never run there.
      - name: Test (blob)
        run: cargo test -p habilis-network --features blob

      # Not covered by `--workspace` above: the loopback suite is behind
      # `required-features = ["native"]`, so a default-feature test run skips
      # it. It stands up two real endpoints and completes a QUIC handshake over
      # a str0m data channel, offline via `IceConfig::host_only()`.
      - name: Test (webrtc, native backend)
        run: cargo test -p habilis-network-iroh-webrtc-transport --features native

      # Not covered by `--workspace` above: the runner's page helpers, and
      # their tests, are behind the `mesh` and `bench` features, and `bench`
      # is the lighter of the two.
      - name: Test (tasks, bench)
        run: cargo test -p tasks --features bench

      # `Test` above already runs the relay-policy proofs
      # (`tests/relay_lookup_only_*.rs`, `tests/mesh_transport_lists.rs`):
      # habilis-network-stream's dev-dependency on habilis-network
      # (`crates/habilis-network-stream/Cargo.toml`) turns on `iroh-test-utils`, and cargo
      # unifies features across the workspace. This step compiles them without
      # that help, so they cannot rot if habilis-network-stream drops the feature.
      - name: Check (relay-policy tests compile)
        run: cargo test -p habilis-network --features iroh-test-utils --all-targets --no-run

      # `--all-targets` is what the plain Clippy step above has and the
      # `--all-features` check step lacks, so the `mesh` feature's e2e suites
      # (~1,100 lines under tasks/src/e2e/) are compiled by CI but never linted.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The TypeScript half of the workspace — `packages/*` and `examples/chat/*`.
  # Nothing ran it before: the only other Bun steps live in `light-cycles (web)`
  # and `working-directory` into that example's own Bun workspace. The cost of
  # the gap is on record — `typecheck:node` shipped pointing at a directory that
  # did not exist, and stayed broken because no job ever called it.
  #
  # No wasm build: `packages/habilis-network-wasm` loads the wasm-bindgen glue through a
  # dynamic import with a hand-declared shape (`src/module.ts`), and its
  # tsconfig covers `src/` and `harness/` only, so both scripts pass on a clean
  # checkout. The glue's own build is covered by `Check (wasm32)`.
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      # Six projects: habilis-network-api, habilis-network-ffi, chat/bun-ffi, habilis-network-wasm,
      # habilis-network-stream-web, chat/web. tsconfig.base.json has no `references`,
      # so each is a standalone `tsc -p` and this is the complete set.
      - name: Typecheck
        run: bun run typecheck

      # Includes the `habilis_network_opts` layout test, the other side of the
      # `size_of::<HabilisNetworkOpts>()` assert in crates/habilis-network-ffi/src/ffi.rs.
      - name: Test
        run: bun run test

  # The C ABI is the whole point of habilis-network-ffi and its only non-Rust consumer
  # links the staticlib. Build it the way that consumer does.
  staticlib:
    name: FFI staticlib
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # `llvm-nm` that matches rustc: with thin LTO the C ABI lives in
          # LLVM bitcode, which an older system `nm` cannot read.
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2

      # Builds the staticlib the way that consumer links it, then checks both
      # directions against include/habilis_network.h: every declaration exported, and
      # every exported `habilis_network_*` symbol declared. The same check runs locally.
      - name: Build the staticlib and check it against the header
        run: cargo task ffi

  # `crates/habilis-network-netplay/examples/light-cycles/native/` is its own cargo
  # workspace (a separate `rust-toolchain.toml` pins it to nightly —
  # `visage-rust-tui` uses native generators, a nightly-only feature — so it
  # can't join the root `check` job's stable toolchain). Not covered by anything
  # above; the root CI doesn't touch `chat-webrtc` either, so this is the first
  # example to get its own job, not a gap being left open.
  light-cycles-native:
    name: light-cycles (native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/habilis-network-netplay/examples/light-cycles/native

    steps:
      - uses: actions/checkout@v6

      # `rust-src-dir` is what makes this read *this workspace's*
      # rust-toolchain.toml (nightly, for `visage-rust-tui`'s generators)
      # rather than the repo root's — the action cds into it before looking
      # for the file, and hard-fails if the path is gone. So the version
      # still lives in exactly one place, same as the root `check` job.
      # It also drives the action's embedded rust-cache (`workspaces`
      # defaults to it), which is why there is no separate cache step here.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: crates/habilis-network-netplay/examples/light-cycles/native
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes `game/tests/two_bots.rs` — two headless bots on a
      # loopback-only mesh, no internet, converging purely from exchanged
      # `lc_turn` inputs. See the plan's "Verification plan" #6.
      #
      # `pubprobe.rs` is ignored: it needs the public relay ladder and a
      # hole-punchable network. What runs here is `two_bots.rs`, offline and
      # deterministic; it wires both crates' tracing to `RUST_LOG`, so a
      # failure prints the captured timeline.
      #
      # The engine stays at `info`: `habilis_network=debug` turns on the per-peer
      # `conn_path` census, which is N actor round-trips per tick. The
      # netplay half is at `debug` because that is where a stuck match
      # actually shows — a session that never leaves `Synchronizing` looks
      # identical to a dead peer from outside, and the packets it discards
      # (a foreign session nonce, a spent sync token, an address in no
      # peer) are the whole story. Each of those is counted and logged on
      # powers of two, so a wedged run costs a few dozen lines, not one per
      # packet.
      - name: Test
        run: cargo test --workspace
        env:
          RUST_LOG: habilis_network=info,habilis_network_netplay=debug,light_cycles_native=debug

  # `crates/habilis-network-netplay/examples/light-cycles/web/wasm/` is its own cargo
  # workspace (an empty `[workspace]` table, same trick chat-web uses —
  # `web-sys` doesn't exist off wasm32). Root toolchain applies (no nightly
  # features here), unlike the native example above.
  light-cycles-web:
    name: light-cycles (web)
    runs-on: ubuntu-latest
    # The wasm crate, not `web/` — most steps below are cargo invocations.
    defaults:
      run:
        working-directory: crates/habilis-network-netplay/examples/light-cycles/web/wasm

    steps:
      - uses: actions/checkout@v6

      # Root toolchain (no `rust-src-dir`): this workspace pins nothing of
      # its own. `cache-workspaces` still has to be spelled out, since it
      # otherwise defaults to `rust-src-dir`, which is unset here.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-workspaces: crates/habilis-network-netplay/examples/light-cycles/web/wasm

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Native (rlib) target: the crate's own unit tests (grid/round/sim/wire
      # logic, ported from — and kept wire-compatible with — native/game's
      # copy) run here since proptest and wasm32 don't mix.
      - name: Test
        run: cargo test

      # `--no-default-features`: the portable half only — see wasm/Cargo.toml's
      # own comment on why. This is the engine actually reaching the browser,
      # not merely being avoidable from it.
      - name: Check (wasm32)
        run: cargo check --target wasm32-unknown-unknown --no-default-features

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features -- -D warnings

      # `wasm-bindgen-cli`'s version must match the `wasm-bindgen` crate
      # version resolved into wasm/Cargo.lock, or the glue it emits and the
      # binary it emits it for disagree at load time. Read out of the
      # lockfile rather than written down again here, so the two cannot
      # drift apart silently.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(cargo pkgid wasm-bindgen | sed 's/.*[@#]//')
          echo "wasm-bindgen resolved to $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build wasm
        working-directory: crates/habilis-network-netplay/examples/light-cycles/web
        run: ./build-wasm.sh

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: crates/habilis-network-netplay/examples/light-cycles/web
        run: bun install --frozen-lockfile

      # Covers the app's own tsconfig.json plus every vendored package's
      # (visage-dom/visage-canvas/visage-style) — see package.json's
      # `typecheck` script. Needs the real wasm build above: `wasm.ts`
      # imports the wasm-bindgen glue's generated types.
      - name: Typecheck
        working-directory: crates/habilis-network-netplay/examples/light-cycles/web
        run: bun run typecheck
