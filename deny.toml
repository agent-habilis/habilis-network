# cargo-deny: only the RustSec advisories gate. CI checks each lockfile of the repo with it.
[advisories]
ignore = [
    # Unmaintained, with no fixed version and no known vulnerability. Path: netlink-packet-core
    # 0.8.1, through netdev 0.45 and the netwatch fork of net-tools. A newer netlink-packet-core
    # that drops paste is being checked in the fork.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, no fixed version, no known vulnerability; via netlink-packet-core 0.8.1 (netdev 0.45, netwatch fork)" },
]
