[package]
name = "habilis-network-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "tracing sink and directive filter for habilis-network"
license = "MIT"
readme = "README.md"
publish = false

[features]
default = ["host"]
# On by default. The parts that need an operating system. Turning it off leaves
# the portable half, which is what a browser needs and all it can have:
# `libc`, unix sockets, signals, processes and the filesystem have no wasm32
# equivalent. A wasm consumer builds the whole graph `--no-default-features`.
host = ["habilis-network-protocol/host", "habilis-network-util/host", "dep:tracing-subscriber"]
# Exposes constructors the engine's adversarial suite injects with.
adversarial = []

[lints]
workspace = true

[lib]
name = "habilis_network_logging"
path = "src/lib.rs"

[dependencies]
habilis-network-protocol = { path = "../habilis-network-protocol", default-features = false }
habilis-network-util = { path = "../habilis-network-util", default-features = false }
# The only crate that names tracing-subscriber, which drags in the regex engine
# behind EnvFilter (~0.7 MiB of __text).
tracing.workspace = true
# The file sink only exists on a host; a browser logs to the console.
tracing-subscriber = { workspace = true, optional = true }
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
habilis-network-protocol = { path = "../habilis-network-protocol", default-features = false, features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
