[package]
name = "habilis-network-iroh-multihop-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "A source-routed multi-hop iroh custom transport: reach peers through relaying peers when no direct path exists."
license = "MIT"
repository = "https://github.com/agent-habilis/habilis-network"
readme = "README.md"
keywords = ["iroh", "transport", "p2p", "routing", "multihop"]
categories = ["network-programming"]
publish = false

[lints]
workspace = true

[lib]
name = "habilis_network_iroh_multihop_transport"
path = "src/lib.rs"

[dependencies]
iroh.workspace = true
habilis-network-iroh-transport-util = { path = "../habilis-network-iroh-transport-util" }
# `CustomAddr` is not re-exported through `iroh`; name it from iroh-base
# directly. A consumer that patches `iroh` to a fork must patch `iroh-base` to
# the same repo and rev, or the graph carries two `iroh_base` versions and the
# `CustomAddr` here stops unifying with the one iroh hands back (E0308). Taking
# both from the workspace is what keeps that impossible from the inside.
iroh-base.workspace = true
noq-udp.workspace = true
n0-watcher.workspace = true
n0-future = "0.3"
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
anyhow.workspace = true
blake3.workspace = true
postcard = { version = "1", features = ["use-std"] }
serde.workspace = true

[dev-dependencies]
tokio.workspace = true
# A local relay server, for the tests that put a connection on the relay.
iroh-relay = { version = "=1.0.3", git = "https://github.com/agent-habilis/iroh", rev = "51e891cff102a7e0696a5a931c2e9770b0225b59", default-features = false, features = ["server"] }
# The tables that take a rung away from one node, for the selector's unit tests.
habilis-network-iroh-transport-util = { path = "../habilis-network-iroh-transport-util", features = ["test-hooks"] }
# For the e2e that puts both custom transports on one endpoint.
habilis-network-iroh-webrtc-transport = { path = "../habilis-network-iroh-webrtc-transport", features = ["native"] }
