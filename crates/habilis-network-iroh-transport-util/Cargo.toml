[package]
name = "habilis-network-iroh-transport-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "Path selection and GSO unbatching shared by the habilis-network iroh custom transports."
license = "MIT"
repository = "https://github.com/agent-habilis/habilis-network"
readme = "README.md"
keywords = ["iroh", "transport", "p2p", "quic", "gso"]
categories = ["network-programming"]
publish = false

[lints]
workspace = true

[lib]
name = "habilis_network_iroh_transport_util"
path = "src/lib.rs"

[features]
default = []
# Tests only. The tables that take one rung, or one IP port, away from one
# node, which every path selector of this workspace reads through `blocked`.
test-hooks = []

[dependencies]
iroh.workspace = true

[dev-dependencies]
# `CustomAddr` is not re-exported through `iroh`; a test builds one to read its id.
iroh-base.workspace = true
