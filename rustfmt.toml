# `imports_granularity` is unstable, so it needs a nightly rustfmt. rust-toolchain.toml pins a
# nightly for the whole project, so a plain `cargo fmt --check` (CI) enforces it.
imports_granularity = "Module"
# Google Rust Style Guide: hex literals in lower case, and macro matchers formatted like code.
hex_literal_case = "Lower"
format_macro_matchers = true
